# 数据源：SQLite（文件位于 backend/data/seepage.db，启动时自动建表）
quarkus.datasource.db-kind=sqlite
# busy_timeout：多连接写入时等待锁释放，避免 SQLITE_BUSY
quarkus.datasource.jdbc.url=jdbc:sqlite:data/seepage.db?busy_timeout=10000
quarkus.datasource.jdbc.max-size=3
# 演示系统：每次启动重建库表并写入种子数据，保证演示场景可重复
quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.limits.max-body-size=25M

# 照片本地存储目录
app.photo-dir=data/photos
# 有效降雨阈值（毫米）：达到才视为满足雨后复查条件
app.min-rainfall-mm=10.0
