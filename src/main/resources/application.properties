# HTTP
quarkus.http.port=8080

# SQLite datasource
quarkus.datasource.db-kind=sqlite
# SQLite：多连接读，写操作由 busy_timeout 在数据库层串行化
quarkus.datasource.jdbc.url=jdbc:sqlite:data/leak.db?busy_timeout=10000
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=30S
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# 业务配置：有效降雨阈值（毫米），雨量达到该值且降雨日晚于施工日，才允许雨后复查
leak.rain.min-mm=10

# 照片本地存储目录
leak.storage.photo-dir=data/photos

# JSON 日期格式
quarkus.jackson.serialization-inclusion=non-null
